<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check IA</title>
    
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- CSS (Corrigido) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="container">
        <!-- LADO ESQUERDO -->
        <div class="left">
            <div class="logo">
                <img class="brand-logo brand-logo--login" src="assets/check-ia-logo.jpeg" alt="Check IA">
            </div>
            <h2>
                Segurança inteligente para aplicações desenvolvidas com Inteligência Artificial.
            </h2>
            <p>
                Analise vulnerabilidades antes da publicação do código.
            </p>
            <div class="cards">
                <div class="card">
                    <i class="fa-solid fa-code"></i>
                    <span>Análise Estática</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-lock"></i>
                    <span>OWASP Top 10</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-bug"></i>
                    <span>Scanner Inteligente</span>
                </div>
                <div class="card">
                    <i class="fa-brands fa-github"></i>
                    <span>Integração GitHub</span>
                </div>
            </div>
        </div>

        <!-- LOGIN -->
        <div class="right">
            <form id="loginForm">
                <h2>Entrar</h2>
                <p>
                    Faça login para acessar o painel.
                </p>
                <div class="input">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                </div>
                <div class="input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>
                <button type="submit">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript (Corrigido) -->
    <script src="css/js/login.js"></script>
</body>
</html>
