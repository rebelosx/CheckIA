<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Check IA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/profile-menu.css">
</head>
<body>

    <div class="container">
        <!-- LADO ESQUERDO -->
        <div class="left">
            <div class="logo">
                <img class="brand-logo brand-logo--login" src="assets/check-ia-logo.png" alt="Check IA">
            </div>
            <h2>
                Segurança inteligente para aplicações desenvolvidas com Inteligência Artificial.
            </h2>
            <p>
                Analise vulnerabilidades antes da publicação do código.
            </p>
            <div class="cards">
                <div class="card">
                    <i class="fa-solid fa-code"></i>
                    <span>Análise Estática</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-lock"></i>
                    <span>OWASP Top 10</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-bug"></i>
                    <span>Scanner Inteligente</span>
                </div>
                <div class="card">
                    <i class="fa-brands fa-github"></i>
                    <span>Integração GitHub</span>
                </div>
            </div>
        </div>

        <!-- CADASTRO -->
        <div class="right">
            <form id="cadastroForm">
                <h2>Criar conta</h2>
                <p>
                    Cadastre-se para começar a proteger seus projetos.
                </p>
                <div class="input">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="input">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                </div>
                <div class="input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" required>
                </div>
                <div class="input">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Repita sua senha" required>
                </div>
                <button type="submit">
                    Criar conta
                </button>
                <p style="margin-top:16px; text-align:center;">
                    Já tem uma conta? <a href="index.html">Entrar</a>
                </p>
            </form>
        </div>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
